<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exam Result Portal</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}
.box{
  max-width:420px;
  margin:30px auto;
  border:3px solid red;
  padding:15px;
  background:#fff;
}
h1{color:red;text-align:center;margin:5px 0;}
h3{text-align:center;margin:3px 0;}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}
button{
  background:#0d6efd;
  color:#fff;
  border:none;
  cursor:pointer;
}
#printBtn{background:#198754;}
#error{color:red;margin-top:10px;}
#result{margin-top:15px;}
</style>
</head>

<body>

<div class="box">
  <h1>BRIGHT CAREER PUBLIC SCHOOL</h1>
  <h3>SHRAWASTI (U.P.)</h3>
  <h3>HALF YEARLY EXAMINATION – 2025 RESULT</h3>

  <input id="roll" placeholder="Enter Roll No (BCPS801)">
  
  <select id="cls">
    <option value="">Select Class</option>
    <option>Class 1</option>
    <option>Class 2</option>
    <option>Class 3</option>
    <option>Class 4</option>
    <option>Class 5</option>
    <option>Class 6</option>
    <option>Class 7</option>
    <option>Class 8</option>
  </select>

  <input type="date" id="dob">

  <button onclick="getResult()">Search</button>
  <button id="printBtn" onclick="window.print()">Print</button>

  <div id="error"></div>
  <div id="result"></div>
</div>

<script>
const SHEET_URL =
"https://opensheet.elk.sh/1ILjMxyHNYmRHzSMkhr7frPfvE67No_Y_i6By-7FeOKQ/Results";

async function getResult(){
  const roll = document.getElementById("roll").value.trim();
  const cls  = document.getElementById("cls").value;
  const dob  = document.getElementById("dob").value;

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.innerHTML="";
  result.innerHTML="";

  if(!roll || !cls || !dob){
    error.innerHTML="Please enter Roll No, Class and DOB";
    return;
  }

  result.innerHTML="Searching...";

  const res = await fetch(SHEET_URL);
  const data = await res.json();

  const row = data.find(r =>
    r["Roll no"] === roll &&
    r["Class"] === cls &&
    r["Dob"] === dob
  );

  if(!row){
    error.innerHTML="Result not found";
    result.innerHTML="";
    return;
  }

  result.innerHTML = `
    <b>Name:</b> ${row.Name}<br>
    <b>Father:</b> ${row["Father name"]}<br>
    <b>Class:</b> ${row.Class}<br>
    <b>Roll No:</b> ${row["Roll no"]}<br>
    <b>DOB:</b> ${row.Dob}<br><br>

    <b>Hindi:</b> ${row.Hindi}<br>
    <b>English:</b> ${row.English}<br>
    <b>Maths:</b> ${row.Maths}<br>
    <b>Science:</b> ${row.Science}<br>
    <b>SST:</b> ${row.SST}<br>
    <b>GK:</b> ${row.GK}<br>
    <b>Art:</b> ${row.Art}<br>
    <b>Moral:</b> ${row.Moral}<br>
    <b>PT:</b> ${row.PT}<br><br>

    <b>Total:</b> ${row.Total}<br>
    <b>Result:</b> ${row.Result}<br>
    <b>Percentage:</b> ${row.Percentage}
  `;
}
</script>

</body>
</html>
