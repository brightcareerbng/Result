<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Result Portal</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
}
.container{
  max-width:600px;
  margin:20px auto;
  background:#fff;
  border:3px solid red;
  padding:15px;
}
.header{
  text-align:center;
}
.header img{
  width:80px;
}
.header h1{
  color:red;
  margin:5px 0;
}
.header h3{
  margin:3px 0;
  font-weight:normal;
}
input, select{
  width:100%;
  padding:10px;
  margin-top:10px;
  font-size:16px;
}
.btns{
  margin-top:15px;
  text-align:center;
}
button{
  padding:10px 25px;
  font-size:16px;
  border:none;
  color:#fff;
  cursor:pointer;
}
.search{background:#0d6efd;}
.print{background:#198754;}
#error{
  color:red;
  margin-top:10px;
  text-align:center;
}
#result{
  margin-top:15px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="https://i.imgur.com/5M0pX5B.png" alt="Logo">
    <h1>BRIGHT CAREER PUBLIC SCHOOL</h1>
    <h3>SHRAWASTI (U.P.)</h3>
    <h3>KOTWALI BHINGA (U-DISE CODE) 09510215001</h3>
    <h3>HALF YEARLY EXAMINATION – 2025 RESULT</h3>
  </div>

  <input id="roll" placeholder="Enter Roll No (BCPS801)">
  
  <select id="cls">
    <option value="">Select Class</option>
    <option>Class 1</option>
    <option>Class 2</option>
    <option>Class 3</option>
    <option>Class 4</option>
    <option>Class 5</option>
    <option>Class 6</option>
    <option>Class 7</option>
    <option>Class 8</option>
  </select>

  <input type="date" id="dob">

  <div class="btns">
    <button class="search" onclick="getResult()">Search</button>
    <button class="print" onclick="window.print()">Print</button>
  </div>

  <div id="error"></div>
  <div id="result"></div>
</div>

<script>
const SHEET_URL =
"https://opensheet.elk.sh/1ILjMxyHNYmRHzSMkhr7frPfvE67No_Y_i6By-7FeOKQ/Results";

async function getResult(){
  const roll = document.getElementById("roll").value.trim();
  const cls  = document.getElementById("cls").value;
  const dob  = document.getElementById("dob").value;

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.innerHTML="";
  result.innerHTML="";

  if(!roll || !cls || !dob){
    error.innerHTML="Please enter Roll No, Class and DOB";
    return;
  }

  result.innerHTML="Searching...";

  try{
    const res = await fetch(SHEET_URL);
    const data = await res.json();

    const row = data.find(r =>
      r["Roll no."] === roll &&
      r["Class"] === cls &&
      r["Dob"] === dob
    );

    if(!row){
      error.innerHTML="Result not found";
      result.innerHTML="";
      return;
    }

    result.innerHTML = `
      <b>Name:</b> ${row["Name"]}<br>
      <b>Father:</b> ${row["Father"]}<br>
      <b>Class:</b> ${row["Class"]}<br>
      <b>Roll No:</b> ${row["Roll no."]}<br>
      <b>DOB:</b> ${row["Dob"]}<br><hr>

      <b>Hindi:</b> ${row["Hindi"]}<br>
      <b>English:</b> ${row["English"]}<br>
      <b>Maths:</b> ${row["Maths"]}<br>
      <b>Science:</b> ${row["Science"]}<br>
      <b>SST:</b> ${row["SST"]}<br>
      <b>GK:</b> ${row["GK"]}<br>
      <b>Art:</b> ${row["Art"]}<br>
      <b>Moral:</b> ${row["Moral"]}<br>
      <b>PT:</b> ${row["PT"]}<br><hr>

      <b>Total:</b> ${row["Total"]}<br>
      <b>Result:</b> ${row["Result"]}<br>
      <b>Percentage:</b> ${row["Percentage"]}
    `;
  }catch(e){
    error.innerHTML="Error loading result. Try again.";
    result.innerHTML="";
  }
}
</script>

</body>
</html>
