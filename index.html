<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Result Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#ffffff;
}
.container{
  max-width:1000px;
  margin:40px auto;
  border:3px solid #d32f2f;
  padding:25px;
}
.header{
  display:flex;
  align-items:center;
  gap:15px;
}
.logo img{
  width:90px;
}
.title{
  text-align:center;
  flex:1;
}
.title h1{
  margin:0;
  color:#d32f2f;
  font-size:26px;
}
.title h3,.title h4{
  margin:4px 0;
  font-weight:normal;
}
.form{
  margin-top:25px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.form input,.form select{
  padding:10px;
  font-size:15px;
  width:220px;
}
.form button{
  padding:10px 18px;
  font-size:15px;
  border:none;
  cursor:pointer;
  background:#1976d2;
  color:#fff;
}
#printBtn{
  background:#388e3c;
}
#result{
  margin-top:20px;
  font-size:15px;
}
.error{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <!-- Yaha apna logo ka link laga sakte ho -->
      <img src="https://i.imgur.com/7bK6zjv.png">
    </div>
    <div class="title">
      <h1>BRIGHT CAREER PUBLIC SCHOOL</h1>
      <h3>SHRAWASTI (U.P.)</h3>
      <h4>KOTWALI BHINGA (U-DISE CODE) 09510215001</h4>
      <h4>HALF YEARLY EXAMINATION – 2025 RESULT</h4>
    </div>
  </div>

  <div class="form">
    <input type="text" id="roll" placeholder="Enter Roll No (BCPS801)">
    
    <select id="cls">
      <option value="">Select Class</option>
      <option>Class 1</option>
      <option>Class 2</option>
      <option>Class 3</option>
      <option>Class 4</option>
      <option>Class 5</option>
      <option>Class 6</option>
      <option>Class 7</option>
      <option>Class 8</option>
    </select>

    <input type="date" id="dob">

    <button onclick="getResult()">Search</button>
    <button id="printBtn" onclick="window.print()">Print</button>
  </div>

  <div id="result"></div>

</div>

<script>
const SHEET_URL =
"https://opensheet.elk.sh/1ILjMxyHNYmRHzSMkhr7frPfvE67No_Y_i6By-7FeOKQ/Results";

async function getResult(){
  const roll = document.getElementById("roll").value.trim();
  const dob  = document.getElementById("dob").value;
  const cls  = document.getElementById("cls").value;
  const out  = document.getElementById("result");

  if(!roll || !dob || !cls){
    out.innerHTML = "<p class='error'>Please enter Roll No, Class and Date of Birth</p>";
    return;
  }

  out.innerHTML = "Searching...";

  const res  = await fetch(SHEET_URL);
  const data = await res.json();

  const row = data.find(r =>
    r["Roll no."] === roll &&
    r["Dob"] === dob &&
    r["Class"] === cls
  );

  if(!row){
    out.innerHTML = "<p class='error'>Result not found</p>";
    return;
  }

  out.innerHTML = `
    <b>Name:</b> ${row.Name}<br>
    <b>Father:</b> ${row.Father}<br>
    <b>Class:</b> ${row.Class}<br>
    <b>Roll No:</b> ${row["Roll no."]}<br>
    <b>DOB:</b> ${row.Dob}<br><br>

    <b>Hindi:</b> ${row.Hindi},
    <b>English:</b> ${row.English},
    <b>Maths:</b> ${row.Maths},
    <b>Science:</b> ${row.Science},
    <b>SST:</b> ${row.SST},
    <b>GK:</b> ${row.GK},
    <b>Art:</b> ${row.Art},
    <b>Moral:</b> ${row.Moral},
    <b>PT:</b> ${row.PT}<br><br>

    <b>Total:</b> ${row.Total}<br>
    <b>Result:</b> ${row.Result}<br>
    <b>Percentage:</b> ${row.Percentage}
  `;
}
</script>

</body>
</html>
